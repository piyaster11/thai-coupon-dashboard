<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>🇹🇭 Bangkok Daily Deals</title>
<meta name="description" content="Today's best promo codes for food, rides, shopping, travel &amp; AI tools — tap to copy">
<meta property="og:title" content="🇹🇭 Bangkok Daily Deals">
<meta property="og:description" content="Today's best promo codes for food, rides, shopping, travel &amp; AI tools — tap to copy">
<meta property="og:locale" content="en_US">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f3f8;color:#1a1d29}
header{background:linear-gradient(135deg,#1e1b4b,#4c1d95 55%,#be185d);color:#fff;padding:32px 18px 26px;text-align:center}
header h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}header p{margin:6px 0 0;opacity:.85}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:0;background:#f1f3f8ee;backdrop-filter:blur(6px);z-index:5;justify-content:center;flex-wrap:wrap}
.filters button{border:0;padding:9px 16px;border-radius:999px;background:#fff;font-weight:600;box-shadow:0 1px 3px #0002;cursor:pointer;font-size:.95rem}
.filters button.on{background:#4c1d95;color:#fff}
main{max-width:760px;margin:0 auto;padding:4px 14px 30px;display:grid;gap:16px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #1e1b4b14;position:relative;border:2px solid transparent}
.card.soon{border-color:#f97316}.soonb{background:#f97316;color:#fff;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rank{width:36px;height:36px;border-radius:50%;background:#1e1b4b;color:#fff;display:grid;place-items:center;font-weight:800}
.chip{color:#fff;font-weight:700;font-size:.8rem;padding:4px 11px;border-radius:999px}.cat{font-size:.8rem;color:#666}
h2{font-size:1.15rem;margin:12px 0 4px}.disc{font-size:1.35rem;font-weight:800;color:#be185d;margin:2px 0 10px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:#444;margin-bottom:10px}
.code{display:flex;align-items:center;gap:10px;border:2.5px dashed #4c1d95;background:#faf5ff;border-radius:12px;padding:10px 10px 10px 14px;margin:8px 0}
.code .c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.45rem;font-weight:800;color:#111;letter-spacing:.06em;flex:1;word-break:break-all;user-select:all}
.code small{display:block;font-family:"Noto Sans Thai",system-ui;font-size:.75rem;color:#666;letter-spacing:0;font-weight:500}
.copy{border:0;background:#4c1d95;color:#fff;font-weight:700;padding:12px 16px;border-radius:10px;font-size:1rem;cursor:pointer;min-width:84px}.copy.ok{background:#16a34a}
.cnt{font-size:.8rem;opacity:.7;margin:-4px 0 8px 4px}.cnt:empty{display:none}
.nocode{display:inline-block;background:#fef3c7;color:#92400e;font-weight:700;padding:10px 14px;border-radius:10px;border:2px dashed #f59e0b;margin:6px 0}
.why{font-size:.9rem;color:#555;margin:8px 0}.src{font-size:.88rem;color:#4c1d95;font-weight:600}
.lang{position:absolute;top:14px;right:14px;display:flex;background:#ffffff22;border:1.5px solid #ffffff66;border-radius:999px;padding:3px}.lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:.85rem}.lang button.on{background:#fff;color:#4c1d95}header{position:relative;padding-top:96px}
.tally{position:absolute;top:58px;right:14px;background:#ffffff22;border:1.5px solid #ffffff66;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.sect{font-size:1.05rem;font-weight:800;color:#1e1b4b;margin:18px 2px 2px;letter-spacing:-.01em}.sect.more{margin-top:28px;padding-top:14px;border-top:2px dashed #c4b5fd;color:#5b21b6}footer{text-align:center;color:#777;padding:20px;font-size:.9rem}
</style></head><body>
<header><div class="lang" role="group" aria-label="Language"><button data-l="th">TH</button><button data-l="en">EN</button></div><div class="tally" id="tally"></div><h1 id="ttl">🇹🇭 Bangkok Daily Deals</h1><p id="sub" style="margin:4px 0 0;opacity:.8">Today's best promo codes for food, rides, shopping, travel &amp; AI tools — tap to copy</p><p id="date">Loading…</p></header>
<div class="filters" id="f"></div><main id="list"></main>
<footer id="foot"></footer>
<script>
const COUNTER_URL="https://coupon-copy-counter.piya-deals.workers.dev"; // e.g. "https://coupon-copy-counter.<subdomain>.workers.dev" — leave empty to disable
let COUNTS={},TOTAL=0;const paintTotal=()=>{const e=document.getElementById("tally");if(e)e.textContent=L().tally(TOTAL)};const ck=c=>String(c).replace(/[^A-Za-z0-9!_-]/g,"").slice(0,40);
const COLORS={"Grab":"#00b14f","Airalo":"#0a7cff","Klook":"#ff5b00","TikTok Shop":"#111","Shopee":"#ee4d2d","Lazada":"#0f146d","Central":"#b8860b","McDonald's":"#da291c","KFC":"#a3080c","Burger King":"#d62300","The Pizza Company":"#e31837","Swensen's":"#c8102e","Sizzler":"#7a1f2b","Bonchon":"#3d1f12","Dairy Queen":"#0055a5","MK":"#c4161c","Bar B Q Plaza":"#2e7d32","After You":"#8b5e3c","Starbucks":"#00704a","Café Amazon":"#5b8c3a","Lotus's":"#00a3a6","Big C":"#e2001a","Makro":"#e30613","Tops":"#e4002b","Gourmet Market":"#2b2b2b","Villa":"#1b5e20","7-Eleven":"#f58220","CardX":"#6d28d9","SCB":"#4e2a84","POINTX":"#8b5cf6","KTC":"#e60012","Agoda":"#5b2c83","Trip.com":"#287dfa","Thai Lion Air":"#e2231a","Hark":"#334155","Repaint":"#db2777","LINE MAN":"#06c755","Claude":"#d97757","OpenCode":"#1f2937","Watsons":"#00a19a"};
const CATS=["All","Food","Restaurants","Supermarkets","Shopping","Rides","Travel","AI Tools","Card Perks"];let data,cur="All";
const I18N={en:{title:"🇹🇭 Bangkok Daily Deals",sub:"Today's best promo codes for food, rides, shopping, travel & AI tools — tap to copy",updated:"Updated ",top10:"Today's Top 10",more:"More picks by category",copy:"Copy",copied:"Copied!",tally:n=>"📋 "+n.toLocaleString("en-US")+(n==1?" copy":" copies"),times:n=>"Copied "+n+(n==1?" time":" times"),nocode:"No code",soon:"⏰ Expires soon",min:"Min",until:"Until ",noend:"No end date listed",src:"Source ↗",foot:"Updated daily ~8am Bangkok time · Always check terms in the app",load:"Loading…",err:"Could not load deals",left:n=>n==0?"Ends today":n==1?"1 day left":n+" days left",cats:{}},
th:{title:"🇹🇭 ดีลเด็ดกรุงเทพฯ ประจำวัน",sub:"รวมโค้ดส่วนลดอาหาร เดินทาง ช็อปปิ้ง ท่องเที่ยว และ AI ที่ใช้ได้วันนี้ — แตะเพื่อคัดลอก",updated:"อัปเดต ",top10:"ท็อป 10 วันนี้",more:"ดีลเพิ่มเติมตามหมวด",copy:"คัดลอก",copied:"คัดลอกแล้ว!",tally:n=>"📋 คัดลอกแล้ว "+n.toLocaleString("en-US")+" ครั้ง",times:n=>"คัดลอกแล้ว "+n+" ครั้ง",nocode:"ไม่มีโค้ด",soon:"⏰ ใกล้หมดเขต",min:"ขั้นต่ำ",until:"ถึง ",noend:"ไม่ระบุวันหมดเขต",src:"ที่มา ↗",foot:"อัปเดตทุกวันราว 8 โมงเช้า (เวลากรุงเทพฯ) · โปรดตรวจสอบเงื่อนไขในแอปทุกครั้ง",load:"กำลังโหลด…",err:"โหลดดีลไม่สำเร็จ",left:n=>n==0?"หมดเขตวันนี้":"หมดเขตใน "+n+" วัน",cats:{All:"ทั้งหมด",Food:"เดลิเวอรี",Restaurants:"ร้านอาหาร",Supermarkets:"ซูเปอร์มาร์เก็ต",Shopping:"ช้อปปิ้ง",Rides:"เดินทาง",Travel:"ท่องเที่ยว","AI Tools":"เครื่องมือ AI","Card Perks":"สิทธิพิเศษบัตร"}}};
const qp=new URLSearchParams(location.search).get("lang");let lang=(qp=="th"||qp=="en")?qp:(localStorage.getItem("lang")||((navigator.language||"").toLowerCase().startsWith("th")?"th":"en"));if(qp==lang)localStorage.setItem("lang",lang);
const L=()=>I18N[lang],tr=(o,k)=>lang=="th"&&o[k+"_th"]?o[k+"_th"]:o[k],cn=c=>L().cats[c]||c;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString(lang=="th"?"th-TH":"en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
function copy(t,b){const done=()=>{b.textContent=L().copied;b.classList.add("ok");setTimeout(()=>{b.textContent=L().copy;b.classList.remove("ok")},1500)};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
function fb(t,done){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}
const cntTxt=c=>{const n=COUNTS[ck(c)]||0;return n>0?esc(L().times(n)):""};
function paintCounts(){paintTotal();document.querySelectorAll(".cnt").forEach(e=>{const n=COUNTS[e.dataset.k]||0;e.textContent=n>0?L().times(n):""})}
function hit(code){const k=ck(code);if(!COUNTER_URL||!k)return;COUNTS[k]=(COUNTS[k]||0)+1;TOTAL++;paintCounts();
fetch(COUNTER_URL+"/hit/"+encodeURIComponent(k),{method:"POST"}).then(r=>r.ok?r.json():null).then(j=>{if(j){if(j.count>COUNTS[k])COUNTS[k]=j.count;if(j.total>TOTAL)TOTAL=j.total;paintCounts()}}).catch(()=>{})}
function card(d,base){const days=d.expiry?Math.round((new Date(d.expiry+"T00:00:00")-base)/864e5):null,soon=days!==null&&days>=0&&days<=3;
const codes=d.codes&&d.codes.length?d.codes.map(c=>`<div class="code"><div class="c">${esc(c.code)}<small>${esc(tr(c,"label"))}</small></div><button class="copy" data-code="${esc(c.code)}">${L().copy}</button></div><div class="cnt" data-k="${esc(ck(c.code))}">${cntTxt(c.code)}</div>`).join(""):`<div class="nocode">${L().nocode}</div>${d.claim?`<p class="why">👉 ${esc(tr(d,"claim"))}</p>`:""}`;
return `<article class="card${soon?" soon":""}"><div class="top"><div class="rank">${d.rank}</div><span class="chip" style="background:${COLORS[d.brand]||"#555"}">${esc(d.brand)}</span><span class="cat">${esc(cn(d.category))}</span>${soon?`<span class="soonb">${L().soon} · ${L().left(days)}</span>`:""}</div>
<h2>${esc(tr(d,"title"))}</h2><div class="disc">${esc(tr(d,"discount"))}</div><div class="meta"><span>🛒 ${L().min}: ${esc(tr(d,"minSpend"))}</span><span>📅 ${d.expiry?L().until+fmt(d.expiry):L().noend}</span></div>
${codes}<p class="why">💡 ${esc(tr(d,"why"))}</p><a class="src" href="${esc(d.source)}" target="_blank" rel="noopener">${L().src}</a></article>`}
function render(){const base=new Date(data.date+"T00:00:00");const items=data.deals.filter(d=>cur=="All"||d.category==cur);
let html="";
if(cur=="All"){const top=items.filter(d=>d.rank<=10),extra=items.filter(d=>d.rank>10);
if(top.length)html+=`<div class="sect">${L().top10}</div>`+top.map(d=>card(d,base)).join("");
if(extra.length)html+=`<div class="sect more">${L().more}</div>`+extra.map(d=>card(d,base)).join("");
}else html=items.map(d=>card(d,base)).join("");
document.getElementById("list").innerHTML=html}
function ui(){document.documentElement.lang=lang;const t=L().title,s=L().sub;document.title=t;ttl.textContent=t;sub.textContent=s;foot.textContent=L().foot;paintTotal();
const md=document.querySelector('meta[name="description"]'),ogt=document.querySelector('meta[property="og:title"]'),ogd=document.querySelector('meta[property="og:description"]'),ogl=document.querySelector('meta[property="og:locale"]');
if(md)md.content=s;if(ogt)ogt.content=t;if(ogd)ogd.content=s;if(ogl)ogl.content=lang=="th"?"th_TH":"en_US";
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==lang));
document.getElementById("f").innerHTML=CATS.map(c=>`<button data-c="${c}" class="${c==cur?"on":""}">${cn(c)}</button>`).join("");
document.getElementById("date").textContent=data?(L().updated+fmt(data.date)):L().load;if(data)render()}
document.querySelector(".lang").onclick=e=>{const l=e.target.dataset.l;if(!l||l==lang)return;lang=l;localStorage.setItem("lang",l);ui()};ui();
document.getElementById("f").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cur=c;document.querySelectorAll("#f button").forEach(b=>b.classList.toggle("on",b.dataset.c==c));render()};
document.getElementById("list").onclick=e=>{const b=e.target.closest(".copy");if(b){copy(b.dataset.code,b);hit(b.dataset.code)}};
if(COUNTER_URL)fetch(COUNTER_URL+"/counts").then(r=>r.ok?r.json():{}).then(j=>{if(j&&typeof j=="object"){if(j.counts&&typeof j.counts=="object"){COUNTS=j.counts;TOTAL=Number(j.total)||0}else{COUNTS=j;TOTAL=Object.values(j).reduce((a,b)=>a+(+b||0),0)}paintCounts()}}).catch(()=>{});
fetch("deals.json?"+Date.now()).then(r=>r.json()).then(j=>{data=j;ui()}).catch(()=>document.getElementById("date").textContent=L().err);
</script></body></html>
