<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thailand Coupon Top 10</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f3f8;color:#1a1d29}
header{background:linear-gradient(135deg,#1e1b4b,#4c1d95 55%,#be185d);color:#fff;padding:32px 18px 26px;text-align:center}
header h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}header p{margin:6px 0 0;opacity:.85}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;position:sticky;top:0;background:#f1f3f8ee;backdrop-filter:blur(6px);z-index:5;justify-content:center;flex-wrap:wrap}
.filters button{border:0;padding:9px 16px;border-radius:999px;background:#fff;font-weight:600;box-shadow:0 1px 3px #0002;cursor:pointer;font-size:.95rem}
.filters button.on{background:#4c1d95;color:#fff}
main{max-width:760px;margin:0 auto;padding:4px 14px 30px;display:grid;gap:16px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #1e1b4b14;position:relative;border:2px solid transparent}
.card.soon{border-color:#f97316}.soonb{background:#f97316;color:#fff;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rank{width:36px;height:36px;border-radius:50%;background:#1e1b4b;color:#fff;display:grid;place-items:center;font-weight:800}
.chip{color:#fff;font-weight:700;font-size:.8rem;padding:4px 11px;border-radius:999px}.cat{font-size:.8rem;color:#666}
h2{font-size:1.15rem;margin:12px 0 4px}.disc{font-size:1.35rem;font-weight:800;color:#be185d;margin:2px 0 10px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:#444;margin-bottom:10px}
.code{display:flex;align-items:center;gap:10px;border:2.5px dashed #4c1d95;background:#faf5ff;border-radius:12px;padding:10px 10px 10px 14px;margin:8px 0}
.code .c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.45rem;font-weight:800;color:#111;letter-spacing:.06em;flex:1;word-break:break-all;user-select:all}
.code small{display:block;font-family:system-ui;font-size:.75rem;color:#666;letter-spacing:0;font-weight:500}
.copy{border:0;background:#4c1d95;color:#fff;font-weight:700;padding:12px 16px;border-radius:10px;font-size:1rem;cursor:pointer;min-width:84px}.copy.ok{background:#16a34a}
.nocode{display:inline-block;background:#fef3c7;color:#92400e;font-weight:700;padding:10px 14px;border-radius:10px;border:2px dashed #f59e0b;margin:6px 0}
.why{font-size:.9rem;color:#555;margin:8px 0}.src{font-size:.88rem;color:#4c1d95;font-weight:600}
footer{text-align:center;color:#777;padding:20px;font-size:.9rem}
</style></head><body>
<header><h1>🇹🇭 Thailand Coupon Top 10</h1><p style="margin:4px 0 0;opacity:.8">Top 10 first, then extra picks</p><p id="date">Loading…</p></header>
<div class="filters" id="f"></div><main id="list"></main>
<footer>Updated daily ~8am Bangkok time · Always check terms in the app</footer>
<script>
const COLORS={"Grab":"#00b14f","Airalo":"#0a7cff","Klook":"#ff5b00","TikTok Shop":"#111","Shopee":"#ee4d2d","Lazada":"#0f146d","Central":"#b8860b","McDonald's":"#da291c","KFC":"#a3080c","Burger King":"#d62300","The Pizza Company":"#e31837","Swensen's":"#c8102e","Sizzler":"#7a1f2b","Bonchon":"#3d1f12","Dairy Queen":"#0055a5","MK":"#c4161c","Bar B Q Plaza":"#2e7d32","After You":"#8b5e3c","Starbucks":"#00704a","Café Amazon":"#5b8c3a","Lotus's":"#00a3a6","Big C":"#e2001a","Makro":"#e30613","Tops":"#e4002b","Gourmet Market":"#2b2b2b","Villa":"#1b5e20","7-Eleven":"#f58220","CardX":"#6d28d9","SCB":"#4e2a84","POINTX":"#8b5cf6","KTC":"#e60012","Agoda":"#5b2c83","Trip.com":"#287dfa","Thai Lion Air":"#e2231a","Hark":"#334155","Repaint":"#db2777"};
const CATS=["All","Food","Restaurants","Supermarkets","Shopping","Rides","Travel","AI Tools","Card Perks"];let data,cur="All";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
function copy(t,b){const done=()=>{b.textContent="Copied!";b.classList.add("ok");setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok")},1500)};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
function fb(t,done){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}
function render(){const base=new Date(data.date+"T00:00:00");document.getElementById("list").innerHTML=data.deals.filter(d=>cur=="All"||d.category==cur).map(d=>{
const days=d.expiry?Math.round((new Date(d.expiry+"T00:00:00")-base)/864e5):null,soon=days!==null&&days>=0&&days<=3;
const codes=d.codes&&d.codes.length?d.codes.map(c=>`<div class="code"><div class="c">${esc(c.code)}<small>${esc(c.label)}</small></div><button class="copy" data-code="${esc(c.code)}">Copy</button></div>`).join(""):`<div class="nocode">No code</div>${d.claim?`<p class="why">👉 ${esc(d.claim)}</p>`:""}`;
return `<article class="card${soon?" soon":""}"><div class="top"><div class="rank">${d.rank}</div><span class="chip" style="background:${COLORS[d.brand]||"#555"}">${esc(d.brand)}</span><span class="cat">${esc(d.category)}</span>${soon?`<span class="soonb">⏰ Expires soon</span>`:""}</div>
<h2>${esc(d.title)}</h2><div class="disc">${esc(d.discount)}</div><div class="meta"><span>🛒 Min: ${esc(d.minSpend)}</span><span>📅 ${d.expiry?"Until "+fmt(d.expiry):"No end date listed"}</span></div>
${codes}<p class="why">💡 ${esc(d.why)}</p><a class="src" href="${esc(d.source)}" target="_blank" rel="noopener">Source ↗</a></article>`}).join("")}
document.getElementById("f").innerHTML=CATS.map(c=>`<button data-c="${c}" class="${c==cur?"on":""}">${c}</button>`).join("");
document.getElementById("f").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cur=c;document.querySelectorAll("#f button").forEach(b=>b.classList.toggle("on",b.dataset.c==c));render()};
document.getElementById("list").onclick=e=>{const b=e.target.closest(".copy");if(b)copy(b.dataset.code,b)};
fetch("deals.json?"+Date.now()).then(r=>r.json()).then(j=>{data=j;document.getElementById("date").textContent=fmt(j.date);render()}).catch(()=>document.getElementById("date").textContent="Could not load deals");
</script></body></html>
